<text x="55" y="160" fill="#fff" font-family="Arial,sans-serif" font-size="85" font-weight="800" letter-spacing="-3">PROVE IT</text>
<text x="59" y="204" fill="#b4c2e7" font-family="Arial,sans-serif" font-size="25">Not just code. Actual working behavior.</text>
<g transform="translate(55 255)" font-family="Arial,sans-serif" font-size="18" font-weight="bold"><rect x="0" y="0" width="175" height="46" rx="13" fill="#202c52" stroke="#4b7193"/><text x="87" y="29" fill="#d8eafa" text-anchor="middle">PLAN</text><text x="194" y="29" fill="#8cf7df">→</text><rect x="225" width="175" height="46" rx="13" fill="#202c52" stroke="#4b7193"/><text x="312" y="29" fill="#d8eafa" text-anchor="middle">BUILD</text><text x="419" y="29" fill="#8cf7df">→</text><rect x="450" width="175" height="46" rx="13" fill="#202c52" stroke="#4b7193"/><text x="537" y="29" fill="#d8eafa" text-anchor="middle">RUN</text><text x="644" y="29" fill="#8cf7df">→</text><rect x="675" width="175" height="46" rx="13" fill="#202c52" stroke="#4b7193"/><text x="762" y="29" fill="#d8eafa" text-anchor="middle">OBSERVE</text><text x="869" y="29" fill="#8cf7df">→</text><rect x="900" width="175" height="46" rx="13" fill="url(#teal)"/><text x="987" y="29" fill="#10182b" text-anchor="middle">VERIFY ✓</text></g>
