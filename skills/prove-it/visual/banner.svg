<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
<title id="title">Prove It v1</title><desc id="desc">A dark gradient banner showing the verified development cycle: Plan, Build, Run, Observe, Verify.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0e1227"/><stop offset="1" stop-color="#191943"/></linearGradient><linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#66edcf"/><stop offset="1" stop-color="#68a2ff"/></linearGradient></defs>
<rect width="1200" height="340" fill="url(#bg)" rx="26"/>
<g opacity=".12" stroke="#9bb8ff" stroke-width="1"><path d="M0 55H1200M0 115H1200M0 175H1200M0 235H1200M0 295H1200"/><path d="M60 0V340M180 0V340M300 0V340M420 0V340M540 0V340M660 0V340M780 0V340M900 0V340M1020 0V340M1140 0V340"/></g>
